; Two environments so the log level is chosen by which build you run, not by
; editing this file:
;
;   pio run                          release  (default) -> .pio/build/esp32c3/
;   pio run -e esp32c3-debug         debug              -> .pio/build/esp32c3-debug/
;   pio run -e esp32c3-debug -t upload && pio device monitor
;
; Log level is a size decision, not just a noise one. The app image must fit the
; 0x140000 (1,310,720 byte) OTA slot, and verbose logging costs ~45 KB -- enough
; to push the build past it, which is exactly how v0.0.4 shipped as an artifact
; no device could install. Measured firmware.bin sizes:
;
;   level 5 -> 1,340,576  OVER by 29,856      level 2 -> 1,304,208   6,512 spare
;   level 3 -> 1,319,088  OVER by  8,368      level 1 -> 1,295,392  15,328 spare
;
; So the debug environment DOES NOT FIT the OTA partition and can only be
; installed over USB. Release builds go through scripts/release.sh, which gates
; on the real firmware.bin size. ESP_LOGE survives at level 1, so genuine
; failures still reach the serial log on a release build.

[common]
platform = espressif32
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_ARCH_ESP32=1
lib_deps =
    FastLED
    IRRemote
    knolleary/PubSubClient

; Release: fits the OTA slot, installable over the air.
[env:esp32c3]
extends = common
build_flags =
    ${common.build_flags}
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_LOG_MAXIMUM_LEVEL_ERROR=y
    -DCONFIG_LOG_MAXIMUM_LEVEL=1
; test/test_rollover is host-compiled C++ with no Arduino/hardware
; dependency (see [env:native] below); a bare `pio test` with no -e would
; otherwise also try to build and run it against this device env, which
; needs a connected board and fails confusingly instead of just not
; applying here.
test_ignore = *

; Debug: full verbose logging. USB only -- too large to install over OTA.
; ENABLE_CLOCK_OFFSET turns on the issue #0008 clock-offset test harness
; (nowMs()/SET_CLOCK_OFFSET in src/main.cpp) so the millis() rollover can be
; reached on the bench in seconds instead of waited out over 49.7 days. This
; flag must stay OUT of [env:esp32c3]: the harness is bench tooling, and this
; env is already USB-only and unbounded by the OTA size gate that
; scripts/release.sh enforces on the release build.
;
; DEV_FORCE_EFFECT (issue #0015's bench hook) was REMOVED here by issue
; #0017: it forced THEME_CUSTOM with a hardcoded CHASE effect at every boot,
; running AFTER loadAllPreferences() and unconditionally overwriting
; whatever effect had just been restored from NVS -- confirmed on hardware
; during issue #0016 that this made every esp32c3-debug build restore the
; WRONG effect after a power cycle. It existed only because nothing could
; set THEME_CUSTOM over MQTT before issue #0016 landed SET_EFFECT, which
; supersedes it.
[env:esp32c3-debug]
extends = common
build_flags =
    ${common.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -DCONFIG_LOG_MAXIMUM_LEVEL_VERBOSE=y
    -DCONFIG_LOG_MAXIMUM_LEVEL=5
    -DENABLE_CLOCK_OFFSET
; EFFECT_TRACE prints one rate-limited line per render carrying the renderer's
; own state (phase/dir/sub/speed/intensity) plus the first 10 pixels it wrote.
; Debug env only -- it is bench instrumentation, and this env is already
; USB-only and outside the OTA size gate. scripts/trace_effect.sh reads it.
    -DEFFECT_TRACE
; See the same note in [env:esp32c3] above -- a bare `pio test` should not
; try to build test/test_rollover against a device env.
test_ignore = *

; Native: host-compiled unit tests (issue #0008). No Arduino/FastLED, no
; hardware -- just the plain-C++ helpers that are safe to lift out of
; main.cpp, such as timeReached() in src/time_utils.h. Run with
; `pio test -e native`. Kept separate from the device envs above so this
; never affects what ships.
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -I src

[platformio]
default_envs = esp32c3
